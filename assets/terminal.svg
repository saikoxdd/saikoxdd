<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" role="img" aria-label="terminal: whoami, stack, enroute deploy">
<style>
.m{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;font-size:15px}
.l{opacity:0;animation:show 16s steps(1) infinite}
@keyframes show{0%{opacity:0}100%{opacity:1}}
.c{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1a"/><stop offset="1" stop-color="#1d1638"/></linearGradient></defs>
<rect x=".5" y=".5" width="639" height="351" rx="14" fill="url(#bg)" stroke="#3b2f63"/>
<rect x=".5" y=".5" width="639" height="36" rx="14" fill="#141027"/><rect x=".5" y="22" width="639" height="15" fill="#141027"/>
<circle cx="24" cy="19" r="6" fill="#ff4d6d"/><circle cx="44" cy="19" r="6" fill="#f5c26b"/><circle cx="64" cy="19" r="6" fill="#8be3a3"/>
<text x="320" y="24" text-anchor="middle" class="m" font-size="13" fill="#8b7fb8">saiko@night: ~</text>
<style>@keyframes s0{0%,3.75%{opacity:0}3.76%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="66" class="m l" style="animation-name:s0"><tspan fill="#ff4d6d">❯</tspan><tspan fill="#c4b5fd"> ~ </tspan><tspan fill="#efeaff">whoami</tspan></text>
<style>@keyframes s1{0%,10.63%{opacity:0}10.64%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="91" class="m l" style="animation-name:s1" fill="#b7a9e6">saiko · backend dev · night owl</text>
<style>@keyframes s2{0%,15.00%{opacity:0}15.01%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="116" class="m l" style="animation-name:s2"><tspan fill="#ff4d6d">❯</tspan><tspan fill="#c4b5fd"> ~ </tspan><tspan fill="#efeaff">cat stack.txt</tspan></text>
<style>@keyframes s3{0%,21.88%{opacity:0}21.89%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="141" class="m l" style="animation-name:s3" fill="#b7a9e6">python  go  postgres  docker  aiogram</text>
<style>@keyframes s4{0%,26.25%{opacity:0}26.26%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="166" class="m l" style="animation-name:s4"><tspan fill="#ff4d6d">❯</tspan><tspan fill="#c4b5fd"> ~ </tspan><tspan fill="#efeaff">enroute deploy --prod</tspan></text>
<style>@keyframes s5{0%,33.13%{opacity:0}33.14%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="191" class="m l" style="animation-name:s5" fill="#8be3a3">building image ........ ✓ done</text>
<style>@keyframes s6{0%,36.56%{opacity:0}36.57%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="216" class="m l" style="animation-name:s6" fill="#8be3a3">running migrations .... ✓ done</text>
<style>@keyframes s7{0%,40.00%{opacity:0}40.01%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="241" class="m l" style="animation-name:s7" fill="#8be3a3">healthcheck ........... ✓ 200 OK</text>
<style>@keyframes s8{0%,43.44%{opacity:0}43.45%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="266" class="m l" style="animation-name:s8"><tspan fill="#ff4d6d">❯</tspan><tspan fill="#c4b5fd"> ~ </tspan><tspan fill="#efeaff">sleep</tspan></text>
<style>@keyframes s9{0%,50.31%{opacity:0}50.32%,97%{opacity:1}100%{opacity:0}}</style>
<text x="22" y="291" class="m l" style="animation-name:s9" fill="#ff8fa3">zsh: command not found: sleep 🌙</text>
<style>@keyframes sc{0%,54.69%{opacity:0}54.70%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:sc"><text x="22" y="316" class="m"><tspan fill="#ff4d6d">❯</tspan><tspan fill="#c4b5fd"> ~ </tspan></text><rect class="c" x="62" y="303" width="9" height="17" fill="#c4b5fd"/></g>
</svg>