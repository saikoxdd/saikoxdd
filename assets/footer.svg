.win{animation:lamp 6s steps(1) infinite}@keyframes lamp{0%,60%{opacity:.9}61%,100%{opacity:.25}}
.f{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif}
.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace}
